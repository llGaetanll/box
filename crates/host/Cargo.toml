winit = { workspace = true }
wgpu = { workspace = true }
ouroboros = { workspace = true }
futures = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }

[build-dependencies]
spirv-builder = { workspace = true }

[lints]
workspace = true
